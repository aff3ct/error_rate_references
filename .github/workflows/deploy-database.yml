name: Deploy Reference Databases

on:
  push:
    branches:
      - develop
      - github-actions-migration

permissions:
  contents: write

jobs:
  deploy-databases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate database.txt
        run: |
          ./.ci/deploy-database-txt.sh . database.txt
          zip database.txt.zip database.txt

      - name: Generate database.json
        run: |
          python3 ./.ci/deploy-database-json.py --refs-path ./ --output database.json --nice-json 1 --hash-type sha1
          zip database.json.zip database.json

      - name: Prepare publish directory
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          mkdir -p "output/$BRANCH_NAME"
          cp database.txt database.txt.zip database.json database.json.zip "output/$BRANCH_NAME/"

      - name: Upload database Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: databases
          path: output/

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true
